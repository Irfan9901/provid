name: PROVID macOS UNIVERSAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  mac:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # -------------------------
    # NODE
    # -------------------------
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    # -------------------------
    # RUST + TARGETS
    # -------------------------
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    # -------------------------
    # FRONTEND INSTALL
    # -------------------------
    - run: npm install

    # -------------------------
    # ENSURE BIN FOLDER EXISTS
    # -------------------------
    - run: mkdir -p src-tauri/bin

    # =========================================================
    # 🔥 BULLETPROOF FFMPEG DOWNLOAD (3 MIRRORS + VALIDATION)
    # =========================================================
    - name: Download FFmpeg (ultra safe)
      run: |
        set -euo pipefail
        cd /tmp

        download_and_extract () {
          URL=$1
          echo "TRYING: $URL"

          if curl -L --fail --retry 3 --retry-delay 2 "$URL" -o ffmpeg.zip; then

            SIZE=$(stat -f%z ffmpeg.zip)

            echo "Downloaded size: $SIZE"

            # reject HTML fake downloads
            if [ "$SIZE" -lt 1000000 ]; then
              echo "File too small → probably HTML error"
              return 1
            fi

            unzip -q ffmpeg.zip || return 1

            DIR=$(find . -type d -name "ffmpeg*" | head -n1)

            if [ -z "$DIR" ]; then
              echo "No ffmpeg directory"
              return 1
            fi

            cp "$DIR/bin/ffmpeg" "$GITHUB_WORKSPACE/src-tauri/bin/ffmpeg-universal-apple-darwin"
            chmod +x "$GITHUB_WORKSPACE/src-tauri/bin/ffmpeg-universal-apple-darwin"

            echo "FFmpeg installed OK"
            return 0
          fi

          return 1
        }

        download_and_extract https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.zip \
        || download_and_extract https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-macos64-gpl.zip \
        || { echo "ALL DOWNLOAD MIRRORS FAILED"; exit 1; }

    # -------------------------
    # BUILD INTEL
    # -------------------------
    - name: Build x86_64
      working-directory: src-tauri
      run: cargo build --release --target x86_64-apple-darwin

    # -------------------------
    # BUILD ARM
    # -------------------------
    - name: Build arm64
      working-directory: src-tauri
      run: cargo build --release --target aarch64-apple-darwin

    # =========================================================
    # CREATE UNIVERSAL APP
    # =========================================================
    - name: Create universal app
      run: |
        set -euo pipefail

        APP=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app" | head -n1)
        ARM=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -n1)

        NAME=$(basename "$APP")
        BIN=$(ls "$APP/Contents/MacOS")

        cp -R "$APP" universal.app

        lipo -create \
          "$APP/Contents/MacOS/$BIN" \
          "$ARM/Contents/MacOS/$BIN" \
          -output "universal.app/Contents/MacOS/$BIN"

    # -------------------------
    # REMOVE QUARANTINE
    # -------------------------
    - name: Clean attributes
      run: xattr -cr universal.app || true

    # =========================================================
    # CREATE DMG
    # =========================================================
    - name: Create DMG
      run: |
        hdiutil create PROVID.dmg \
          -volname PROVID \
          -srcfolder universal.app \
          -ov -format UDZO

    # =========================================================
    # CREATE PKG (ADMIN PASSWORD + INSTALL TO /Applications)
    # =========================================================
    - name: Create PKG installer
      run: |
        mkdir pkgroot
        cp -R universal.app pkgroot/

        pkgbuild \
          --root pkgroot \
          --identifier com.provid.app \
          --install-location /Applications \
          PROVID.pkg

    # =========================================================
    # UPLOAD ARTIFACTS
    # =========================================================
    - uses: actions/upload-artifact@v4
      with:
        name: PROVID-mac
        path: |
          PROVID.dmg
          PROVID.pkg
