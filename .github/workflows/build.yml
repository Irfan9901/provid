name: Build Provid

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
strategy:
fail-fast: false
matrix:
os: [macos-latest, windows-latest, ubuntu-latest]

runs-on: ${{ matrix.os }}

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable

  # ---------- MAC ----------
  - name: Install Mac deps + ffmpeg
    if: matrix.os == 'macos-latest'
    run: |
      brew install ffmpeg
      mkdir -p src-tauri/bin
      cp $(which ffmpeg) src-tauri/bin/ffmpeg-aarch64-apple-darwin
      chmod +x src-tauri/bin/ffmpeg-aarch64-apple-darwin

  # ---------- WINDOWS ----------
  - name: Install Windows ffmpeg
    if: matrix.os == 'windows-latest'
    shell: powershell
    run: |
      Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
      Expand-Archive ffmpeg.zip -DestinationPath .
      $ff = Get-ChildItem -Recurse -Filter ffmpeg.exe | Select-Object -First 1
      New-Item -ItemType Directory -Force -Path src-tauri/bin
      Copy-Item $ff.FullName src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe

  # ---------- LINUX ----------
  - name: Install Linux deps + ffmpeg
    if: matrix.os == 'ubuntu-latest'
    run: |
      sudo apt update
      sudo apt install -y \
        libwebkit2gtk-4.1-dev \
        libgtk-3-dev \
        libayatana-appindicator3-dev \
        librsvg2-dev \
        ffmpeg

      mkdir -p src-tauri/bin
      cp $(which ffmpeg) src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu
      chmod +x src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu

  - name: Install npm deps
    run: npm install

  - name: Build Tauri
    run: npm run tauri build

  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: provid-${{ matrix.os }}
      path: src-tauri/target/release/bundle

