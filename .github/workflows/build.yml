name: PROVID macOS Universal Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Node
      # -------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------
      # Rust
      # -------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin

      # -------------------------
      # Install frontend deps
      # -------------------------
      - run: npm install

      # -------------------------
      # CREATE BIN FOLDER (IMPORTANT)
      # -------------------------
      - run: mkdir -p src-tauri/bin

      # -------------------------
      # DOWNLOAD FFmpeg SAFE SOURCE
      # (uses evermeet.cx — stable mac builds)
      # -------------------------
      - name: Download FFmpeg universal
        run: |
          set -e

          cd /tmp

          curl -L https://evermeet.cx/ffmpeg/getrelease/zip -o ffmpeg.zip
          unzip ffmpeg.zip

          chmod +x ffmpeg

          cp ffmpeg "$GITHUB_WORKSPACE/src-tauri/bin/ffmpeg-universal-apple-darwin"

      # -------------------------
      # BUILD BOTH ARCH
      # -------------------------
      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: src-tauri

      - name: Build Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: src-tauri

      # -------------------------
      # CREATE UNIVERSAL BINARY
      # -------------------------
      - name: Merge universal binary
        run: |
          set -e

          APP_NAME=$(node -p "require('./src-tauri/tauri.conf.json').package.productName")

          INTEL=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app" | head -n1)
          ARM=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -n1)

          cp -R "$INTEL" universal.app

          lipo -create \
            "$INTEL/Contents/MacOS/$APP_NAME" \
            "$ARM/Contents/MacOS/$APP_NAME" \
            -output universal.app/Contents/MacOS/$APP_NAME

      # -------------------------
      # REMOVE QUARANTINE ATTRIBUTE
      # -------------------------
      - name: Remove quarantine
        run: |
          xattr -cr universal.app || true

      # -------------------------
      # CREATE DMG
      # -------------------------
      - name: Create DMG
        run: |
          hdiutil create PROVID.dmg \
            -volname "PROVID" \
            -srcfolder universal.app \
            -ov -format UDZO

      # -------------------------
      # CREATE PKG INSTALLER
      # (asks admin password + removes quarantine)
      # -------------------------
      - name: Create PKG installer
        run: |
          mkdir pkgroot
          cp -R universal.app pkgroot/

          pkgbuild \
            --root pkgroot \
            --identifier com.provid.app \
            --install-location /Applications \
            PROVID.pkg

      # -------------------------
      # UPLOAD ARTIFACTS
      # -------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: PROVID-mac
          path: |
            PROVID.dmg
            PROVID.pkg
